name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # package corre las pruebas y además arma el jar ejecutable.
      - name: Compilar, probar y empaquetar
        run: ./mvnw -B package
